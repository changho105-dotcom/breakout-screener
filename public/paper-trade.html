<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실전 가상매매 트래커</title>
<style>
  :root {
    --bg: #0B0E11;
    --panel: #12161C;
    --border: #232830;
    --text: #E6E8EB;
    --muted: #8A93A1;
    --green: #26C281;
    --red: #E5484D;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--muted); }
  .stat-row b { color: var(--text); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .signal-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 24px;
  }
  .signal-box.has-signals { border-color: #4B9EFF; background: rgba(75,158,255,0.08); }
  .signal-box h2 { font-size: 15px; margin: 0 0 4px; }
  .signal-box .sub2 { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .signal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 8px;
    font-size: 14px;
  }
  .signal-badge {
    font-weight: 700;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .signal-badge.buy { background: rgba(38,194,129,0.18); color: var(--green); }
  .signal-badge.sell { background: rgba(229,72,77,0.18); color: var(--red); }
  pre.log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 12.5px;
    white-space: pre-wrap;
    line-height: 1.6;
    max-height: 600px;
    overflow-y: auto;
  }
  a { color: #4B9EFF; }
</style>
</head>
<body>
<h1>실전 가상매매 트래커</h1>
<div class="sub" id="subline">불러오는 중...</div>

<div id="signalBox"></div>

<div class="grid" id="cards"></div>

<h2 style="font-size:15px;margin:24px 0 8px;">일별 로그</h2>
<pre class="log" id="log">불러오는 중...</pre>

<script>
function fmt(n) { return Math.round(n).toLocaleString(); }

function renderSignalBox(todaySignals, lastRunDate) {
  const box = document.getElementById('signalBox');
  const hasSignals = todaySignals && todaySignals.length > 0;
  const dateLabel = lastRunDate || '-';
  if (!hasSignals) {
    box.innerHTML = `
      <div class="signal-box">
        <h2>오늘의 매매 신호</h2>
        <div class="sub2">최근 처리일: ${dateLabel}</div>
        <div class="empty">신규 매수/매도 신호 없음 (직접 매매하실 필요 없음)</div>
      </div>`;
    return;
  }
  const itemsHtml = todaySignals.map(s => {
    const isBuy = s.action === 'buy';
    const priceStr = s.unit === '$' ? `$${Number(s.price).toFixed(2)}` : `${fmt(s.price)}원`;
    const label = isBuy
      ? `${s.market} 매수 — ${s.ticker} ${s.name || ''} @ ${priceStr} x ${s.shares}주`
      : `${s.market} 매도 — ${s.ticker} ${s.name || ''} @ ${priceStr} x ${s.shares}주 (${s.reason || ''}, 손익 ${s.pnl >= 0 ? '+' : ''}${s.unit === '$' ? '$' + Number(s.pnl).toFixed(2) : fmt(s.pnl) + '원'})`;
    return `<div class="signal-item"><span class="signal-badge ${isBuy ? 'buy' : 'sell'}">${isBuy ? '매수' : '매도'}</span><span>${label}</span></div>`;
  }).join('');
  box.innerHTML = `
    <div class="signal-box has-signals">
      <h2>🔔 오늘의 매매 신호 (직접 매매 시 참고)</h2>
      <div class="sub2">처리일: ${dateLabel}</div>
      ${itemsHtml}
    </div>`;
}

async function load() {
  const res = await fetch('/api/paper-trade');
  const { state, log, todaySignals, lastRunDate } = await res.json();
  if (!state) {
    document.getElementById('subline').textContent = '아직 시작 전입니다.';
    document.getElementById('log').textContent = log || '(로그 없음)';
    return;
  }
  renderSignalBox(todaySignals, lastRunDate);
  document.getElementById('subline').textContent =
    `시작일: ${state.startDate} · ${state.dayCount}일차`;

  const krTotal = state.kr.cash + state.kr.positions.length * 0; // 보유종목 평가액은 진입가 기준으로 표시
  const krPosValue = state.kr.positions.reduce((a, p) => a + p.entryPrice * p.shares, 0);

  const usPosValue = state.us.positions.reduce((a, p) => a + p.entryPrice * p.shares, 0);

  const cardsHtml = `
    <div class="card">
      <h2>한화 포트폴리오 (5천만원)</h2>
      <div class="stat-row"><span>현금</span><b>${fmt(state.kr.cash)}원</b></div>
      <div class="stat-row"><span>보유 종목 매수원가 합</span><b>${fmt(krPosValue)}원</b></div>
      <div class="stat-row"><span>실현손익</span><b class="${state.kr.realizedPnl >= 0 ? 'pos' : 'neg'}">${state.kr.realizedPnl >= 0 ? '+' : ''}${fmt(state.kr.realizedPnl)}원</b></div>
      <div class="stat-row"><span>보유 종목 수</span><b>${state.kr.positions.length} / 10</b></div>
      ${state.kr.positions.length ? `
      <table>
        <tr><th>종목</th><th>시장</th><th>진입일</th><th>진입가</th><th>수량</th><th>손절선</th></tr>
        ${state.kr.positions.map(p => `<tr><td>${p.ticker} ${p.name || ''}</td><td>${p.market || ''}</td><td>${p.entryDate}</td><td>${fmt(p.entryPrice)}</td><td>${p.shares}</td><td>${fmt(p.stopLoss)}</td></tr>`).join('')}
      </table>` : '<div class="empty">보유 종목 없음</div>'}
    </div>
    <div class="card">
      <h2>달러 포트폴리오 (5천만원 상당, 시작환율 ${state.us.fxRateAtStart ? state.us.fxRateAtStart.toFixed(1) : '-'})</h2>
      <div class="stat-row"><span>현금</span><b>$${state.us.cashUsd ? state.us.cashUsd.toFixed(2) : '-'}</b></div>
      <div class="stat-row"><span>보유 종목 매수원가 합</span><b>$${usPosValue.toFixed(2)}</b></div>
      <div class="stat-row"><span>실현손익</span><b class="${state.us.realizedPnl >= 0 ? 'pos' : 'neg'}">${state.us.realizedPnl >= 0 ? '+' : ''}$${state.us.realizedPnl.toFixed(2)}</b></div>
      <div class="stat-row"><span>보유 종목 수</span><b>${state.us.positions.length} / 10</b></div>
      ${state.us.positions.length ? `
      <table>
        <tr><th>종목</th><th>진입일</th><th>진입가</th><th>수량</th><th>손절선</th></tr>
        ${state.us.positions.map(p => `<tr><td>${p.ticker} ${p.name || ''}</td><td>${p.entryDate}</td><td>$${p.entryPrice.toFixed(2)}</td><td>${p.shares}</td><td>$${p.stopLoss.toFixed(2)}</td></tr>`).join('')}
      </table>` : '<div class="empty">보유 종목 없음</div>'}
    </div>
  `;
  document.getElementById('cards').innerHTML = cardsHtml;
  document.getElementById('log').textContent = log || '(로그 없음)';
}
load().catch(e => { document.getElementById('subline').textContent = '오류: ' + e.message; });
</script>
</body>
</html>
